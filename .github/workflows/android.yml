name: Android CI

# Runs on PRs only. Branch protection requires this check to pass and the PR
# branch to be up to date with main before merging, so the merged commit is
# already validated - re-running on push to main would be redundant. The
# Android Release workflow handles the post-merge build.
on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug test
