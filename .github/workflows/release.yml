name: Android Release

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    name: Build Release APK and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Set up release signing config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > donetick-release-key.keystore
          echo "storePassword=$RELEASE_KEYSTORE_PASSWORD" > signing.properties
          echo "keyPassword=$RELEASE_KEY_PASSWORD" >> signing.properties

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Remove signing files
        if: always()
        run: rm -f donetick-release-key.keystore signing.properties

      - name: Get version name
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/DonetickMobile.v${{ steps.get_version.outputs.version_name }}.apk

      - name: Delete existing release tag if present
        run: git push origin ":refs/tags/v${{ steps.get_version.outputs.version_name }}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version_name }}
          name: DoneTick v${{ steps.get_version.outputs.version_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/release/DonetickMobile.v${{ steps.get_version.outputs.version_name }}.apk
